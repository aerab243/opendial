; Plage de ports RTP du banc de test.
;
; Volontairement étroite (100 ports ≈ 50 appels simultanés) : elle doit rester
; alignée sur l'exposition de ports du docker-compose. Une plage plus large
; fonctionnerait, mais élargirait inutilement la surface réseau ouverte.

[general]
rtpstart = 10000
rtpend = 10100

; Qualité de service : marquage DSCP EF (Expedited Forwarding) sur les paquets
; RTP, comme le fait un serveur de production. Sans effet en loopback, mais
; cela garantit que la configuration testée est représentative.
tos_audio = ef
cos_audio = 5
