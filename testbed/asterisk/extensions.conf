; Plan de numérotation d'Asterisk pour le banc de test opendial.
;
; Minimal par construction : chaque poste peut appeler l'autre, et un echo test
; est disponible pour vérifier rapidement qu'un flux audio est établi dans les
; deux sens.

[general]
static = yes
writeprotect = yes

[opendial]

; ---------------------------------------------------------------------------
; Appel entre postes : composer 1001 ou 1002.
; ---------------------------------------------------------------------------
exten => 1001,1,NoOp(Appel vers le poste 1001)
 same => n,Dial(PJSIP/1001,30,tT)
 same => n,Voicemail(1001@default,u)
 same => n,Hangup()

exten => 1002,1,NoOp(Appel vers le poste 1002)
 same => n,Dial(PJSIP/1002,30,tT)
 same => n,Voicemail(1002@default,u)
 same => n,Hangup()

; ---------------------------------------------------------------------------
; Echo test — composer 600.
;
; Asterisk renvoie l'audio reçu. C'est le test le plus direct pour valider le
; pipeline média d'opendial : si l'on s'entend avec un délai, la capture,
; l'encodage, le RTP et la lecture fonctionnent tous. En cas d'échec, cela
; distingue un problème de signalisation d'un problème d'audio.
;
; Avec « tT », l'utilisateur peut composer 0 pendant l'écho pour revenir au
; menu — utile pour tester le DTMF RFC 2833.
; ---------------------------------------------------------------------------
exten => 600,1,NoOp(Echo test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; ---------------------------------------------------------------------------
; Annonce de bienvenue — composer 601.
;
; Permet de vérifier le sens descendant seul (lecture audio), sans dépendre du
; micro ni de la capture. Utile pour isoler un problème de haut-parleur.
; ---------------------------------------------------------------------------
exten => 601,1,NoOp(Annonce de test)
 same => n,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()

; ---------------------------------------------------------------------------
; Répondeur minimal — attrape tout ce qui n'est pas reconnu.
; ---------------------------------------------------------------------------
exten => _X.,1,NoOp(Numéro inconnu : ${EXTEN})
 same => n,Playback(ss-noservice)
 same => n,Hangup()
