; Configuration PJSIP d'Asterisk pour le banc de test opendial.
;
; Deux comptes de test : 1001 et 1002. Le mot de passe est volontairement
; trivial — ce serveur ne doit JAMAIS être exposé au-delà de la machine de
; développement (voir l'avertissement en tête du README du testbed).
;
; NOTE — DEUX PIÈGES DE CONFIGURATION, tous deux rencontrés lors de la mise au
; point de ce fichier :
;
; 1. Les TROIS sections d'un même compte doivent porter le MÊME NOM (`[1001]`),
;    et c'est le champ `type =` qui indique à Asterisk s'il s'agit d'un
;    endpoint, d'une authentification ou d'un aor. Ce sont trois registres
;    distincts (sorcery), donc un même nom y coexiste sans conflit.
;    Nommer l'endpoint « endpoint-1001 » et l'aor « aor-1001 » ne fonctionne
;    pas : Asterisk apparie la partie utilisateur de l'URI To au NOM de l'aor,
;    et répondrait 404 Not Found.
;
; 2. Ne PAS appliquer de modèle `(!)` sur ces sections : la combinaison
;    « nom répété + modèle » empêche le chargement de l'ensemble du fichier,
;    sans message d'erreur explicite — `pjsip show endpoints` renvoie alors
;    simplement « No objects found ». Les valeurs sont donc écrites
;    explicitement pour chaque compte.

[global]
type = global
; Avec `username` en premier, Asterisk résout le compte à partir de la partie
; utilisateur de l'en-tête From — le comportement attendu pour un IPBX.
endpoint_identifier_order = username,ip,anonymous

; ---------------------------------------------------------------------------
; Transports
; ---------------------------------------------------------------------------
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060

; ---------------------------------------------------------------------------
; Compte 1001
; ---------------------------------------------------------------------------

; Comportement du poste.
[1001]
type = endpoint
context = opendial
disallow = all
; G.711 en priorité — c'est le codec de la Phase 2, celui qu'on veut entendre
; en premier. Opus suit, pour la Phase 3.
allow = ulaw
allow = alaw
allow = opus
; Le serveur reste dans le chemin média : indispensable pour tester le NAT et
; pour observer le RTP avec des outils comme sngrep.
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
; 20 ms de packetisation, valeur standard du monde téléphonique.
dtmf_mode = rfc4733
auth = 1001
aors = 1001

; Identifiants d'authentification (digest).
[1001]
type = auth
auth_type = userpass
username = 1001
password = opendial

; Adresse d'enregistrement du poste.
[1001]
type = aor
max_contacts = 5
; En dessous de cette durée, Asterisk rejetterait un REGISTER à expiration
; trop courte.
minimum_expiration = 60
default_expiration = 300

; ---------------------------------------------------------------------------
; Compte 1002
; ---------------------------------------------------------------------------
[1002]
type = endpoint
context = opendial
disallow = all
allow = ulaw
allow = alaw
allow = opus
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733
auth = 1002
aors = 1002

[1002]
type = auth
auth_type = userpass
username = 1002
password = opendial

[1002]
type = aor
max_contacts = 5
minimum_expiration = 60
default_expiration = 300
