# Configuration cargo-deny — application automatisée de l'ADR-0003.
#
# Cette configuration est le garde-fou du projet : elle rend IMPOSSIBLE
# l'introduction accidentelle d'une dépendance sous licence copyleft. C'est
# précisément ce qui manquait à MicroSIP, qui s'est soudé à PJSIP (GPLv2) et en
# a hérité la licence de façon irréversible.
#
# Les clés de premier niveau reconnues par cargo-deny sont exactement :
#   advisories, bans, licenses, sources, graph, targets, exclude, features,
#   all-features, no-default-features, exclude-dev, output, feature-depth
# Toute autre clé fait échouer la vérification du schéma.

[graph]
# Toutes les fonctionnalités sont analysées, y compris celles désactivées par
# défaut : `rustrtc` cache `spandsp-sys` (LGPL) derrière sa feature `t38`,
# qu'il faut voir même sans l'activer.
all-features = true

# ---------------------------------------------------------------------------
# Licences
# ---------------------------------------------------------------------------
[licenses]
version = 2

# Liste blanche — licences permissives compatibles MPL-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
]

# Licences explicitement refusées, avec leur motif.
deny = [
    { name = "GPL-2.0", reason = "copyleft fort : contaminerait la licence d'opendial" },
    { name = "GPL-2.0-only", reason = "copyleft fort : contaminerait la licence d'opendial" },
    { name = "GPL-2.0-or-later", reason = "copyleft fort : contaminerait la licence d'opendial" },
    { name = "GPL-3.0", reason = "copyleft fort : contaminerait la licence d'opendial" },
    { name = "GPL-3.0-only", reason = "copyleft fort : contaminerait la licence d'opendial" },
    { name = "GPL-3.0-or-later", reason = "copyleft fort : contaminerait la licence d'opendial" },
    { name = "AGPL-3.0", reason = "contamination déclenchée par usage réseau" },
    { name = "AGPL-3.0-only", reason = "contamination déclenchée par usage réseau" },
    { name = "AGPL-3.0-or-later", reason = "contamination déclenchée par usage réseau" },
    { name = "SSPL-1.0", reason = "licence non libre, incompatible avec l'open source" },
]

# Ring utilise une licence composite qu'il faut déclarer pour chaque composant.
[[licenses.exceptions]]
name = "ring"
allow = ["OpenSSL", "ISC"]

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# ---------------------------------------------------------------------------
# Vulnérabilités
# ---------------------------------------------------------------------------
[advisories]
version = 2
ignore = []
# Une dépendance devenue non maintenue est signalée.
unmaintained = "workspace"

# ---------------------------------------------------------------------------
# Versions multiples
# ---------------------------------------------------------------------------
# `bans` (et non `duplicates`, qui n'existe pas) : deux versions d'une même
# crate se traduisent par deux copies du code dans le binaire.
[bans]
multiple-versions = "warn"
wildcards = "deny"
