# Configuration cargo-deny — application automatisée de l'ADR-0003.
#
# Cette configuration est la garde-fou du projet : elle rend IMPOSSIBLE
# l'introduction accidentelle d'une dépendance sous licence copyleft. C'est
# précisément ce qui manquait à MicroSIP, qui s'est soudé à PJSIP (GPLv2) et en
# a hérité la licence de façon irréversible.

[graph]
# Toutes les cibles sont analysées, y compris les dépendances de développement
# et de build : elles ne sont pas distribuées, mais elles s'exécutent pendant
# la construction et méritent le même examen.
all-features = false

# ---------------------------------------------------------------------------
# Licences
# ---------------------------------------------------------------------------
[licenses]
version = 2
# Refuse toute licence absente de la liste `allow`. Une licence non déclarée
# est traitée comme interdite (ADR-0003, liste grise).
unused-allowed-license = "deny"

# Liste blanche — licences permissives compatibles MPL-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
]

# Licences explicitement refusées, avec leur motif.
deny = [
    # Contaminerait opendial et forcerait la GPL — l'exact opposé de l'ADR-0001.
    { name = "GPL-2.0", reason = "copyleft fort : contaminerait la licence d'opendial" },
    { name = "GPL-2.0-only", reason = "copyleft fort : contaminerait la licence d'opendial" },
    { name = "GPL-2.0-or-later", reason = "copyleft fort : contaminerait la licence d'opendial" },
    { name = "GPL-3.0", reason = "copyleft fort : contaminerait la licence d'opendial" },
    { name = "GPL-3.0-only", reason = "copyleft fort : contaminerait la licence d'opendial" },
    { name = "GPL-3.0-or-later", reason = "copyleft fort : contaminerait la licence d'opendial" },
    { name = "AGPL-3.0", reason = "contamination déclenchée par usage réseau" },
    { name = "AGPL-3.0-only", reason = "contamination déclenchée par usage réseau" },
    { name = "AGPL-3.0-or-later", reason = "contamination déclenchée par usage réseau" },
    { name = "SSPL-1.0", reason = "licence non libre, incompatible avec l'open source" },
]

# Certaines licences ne sont acceptables que pour du code non distribué.
# LGPL : uniquement en liaison dynamique, avec audit documenté (ADR-0003).
[[licenses.exceptions]]
name = "ring"
allow = ["OpenSSL", "ISC"]

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# ---------------------------------------------------------------------------
# Vulnérabilités
# ---------------------------------------------------------------------------
[advisories]
version = 2
ignore = []
# Un avis de sécurité non corrigé fait échouer la CI dès qu'il paraît.
unmaintained = "workspace"

# ---------------------------------------------------------------------------
# Doublons
# ---------------------------------------------------------------------------
[duplicates]
# Deux versions d'une même crate se traduisent par deux copies du code dans le
# binaire. Signalé, sans bloquer : certaines situations sont légitimes.
max = 2
