# Configuration cargo-deny — application automatisée de l'ADR-0003.
#
# Cette configuration est le garde-fou du projet : elle rend IMPOSSIBLE
# l'introduction accidentelle d'une dépendance sous licence copyleft. C'est
# précisément ce qui manquait à MicroSIP, qui s'est soudé à PJSIP (GPLv2) et en
# a hérité la licence de façon irréversible.
#
# Les clés de premier niveau reconnues par cargo-deny sont exactement :
#   advisories, bans, licenses, sources, graph, targets, exclude, features,
#   all-features, no-default-features, exclude-dev, output, feature-depth
# Toute autre clé fait échouer la vérification du schéma.

[graph]
# Toutes les fonctionnalités sont analysées, y compris celles désactivées par
# défaut : `rustrtc` cache `spandsp-sys` (LGPL) derrière sa feature `t38`,
# qu'il faut voir même sans l'activer.
all-features = true

# ---------------------------------------------------------------------------
# Licences
# ---------------------------------------------------------------------------
[licenses]
version = 2

# Liste blanche — licences permissives compatibles MPL-2.0.
#
# C'est une liste blanche STRICTE : tout ce qui n'y figure pas est refusé.
# La liste noire explicite (`deny = [...]`) a été retirée de cargo-deny
# (cf. EmbarkStudios/cargo-deny#611) — elle faisait double emploi avec cette
# approche, plus simple et plus sûre : une licence inconnue est rejetée par
# défaut, au lieu d'être acceptée faute d'avoir été listée.
#
# Sont donc refusés sans avoir à les nommer : toutes les variantes GPL, AGPL
# et SSPL, ainsi que toute licence non déclarée.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
]

# Ring utilise une licence composite qu'il faut déclarer pour chaque composant.
[[licenses.exceptions]]
name = "ring"
allow = ["OpenSSL", "ISC"]

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# ---------------------------------------------------------------------------
# Vulnérabilités
# ---------------------------------------------------------------------------
[advisories]
version = 2
# Aucun avis ignoré : toute vulnérabilité connue doit être traitée.
ignore = []
# `unmaintained` n'est pas fixé ici : sa syntaxe a changé selon les versions de
# cargo-deny (chaîne ou table), et une valeur mal formée fait échouer la
# validation du fichier entier. Le comportement par défaut suffit — les
# dépendances non maintenues sont signalées pour le workspace.

# ---------------------------------------------------------------------------
# Versions multiples
# ---------------------------------------------------------------------------
# `bans` (et non `duplicates`, qui n'existe pas) : deux versions d'une même
# crate se traduisent par deux copies du code dans le binaire.
[bans]
multiple-versions = "warn"
wildcards = "deny"
