[package]
name = "od-ffi"
description = "opendial — façade FFI vers Flutter. Aucune logique métier."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Ce crate produit une bibliothèque dynamique chargée par Flutter.
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

# od-ffi ne contient AUCUNE logique métier : elle traduit des appels Dart en
# opérations du domaine, et publie les événements du domaine vers Dart.
[dependencies]
od-core = { path = "../od-core", version = "0.1.0" }
od-config = { path = "../od-config", version = "0.1.0" }
od-sip = { path = "../od-sip", version = "0.1.0" }
thiserror.workspace = true
tracing.workspace = true

[lints]
workspace = true
